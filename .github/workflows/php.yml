name: PHP Linting and Tests

on:
  pull_request:
    branches:
      - trunk
      - 'feature/**'
      - 'release/**'

jobs:
  lint:
    name:    PHP Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get cached composer directories
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools:       composer
          coverage:    none

      - name: Install PHP dependencies
        run: composer self-update && composer install --no-ansi --no-interaction --prefer-dist --no-progress

      - name: Run PHP Linter
        run: npm run lint:php

  test:
    name: PHP Unit Tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        # Targeted matrix rather than full WP × PHP cartesian product. Covers
        # the declared compatibility floor, the WP-recommended PHP version,
        # and the newest actively-supported PHP release. PHP 7.4 (EOL Nov 2022)
        # is kept only as a smoke test against the plugin's declared floor;
        # 8.0–8.2 are dropped as they're either EOL or security-only and a
        # break on those would also surface against 7.4 or 8.3.
        include:
          - { wp: '6.4', php: '7.4', wpmu: 0 }
          - { wp: '6.9', php: '8.3', wpmu: 0 }
          - { wp: '6.9', php: '8.4', wpmu: 0 }
    env:
      WP_VERSION: ${{ matrix.wp }}
      PHP_VERSION: ${{ matrix.php }}
    services:
      database:
        image: mysql:5.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get cached composer directories
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysql
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer self-update && composer install --no-ansi --no-interaction --prefer-dist --no-progress

      - name: Setup test environment
        run: bash ./tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 $WP_VERSION

      - name: Run tests
        run: npm run test-php

  psalm:
    name: Psalm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        php: [ '7.4', '8.3' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get cached composer directories
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - uses: actions/cache@v4
        with:
          path: vendor/
          key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install
        run: composer self-update && composer install --no-ansi --no-interaction --prefer-dist --no-progress

      - name: Run Psalm
        run: ./vendor/bin/psalm
